# NGD-Fin 演示题集（人工核对，2026-10-21）。
# 上游 NL 题面常丢 Cypher 常数、否定翻转、把关系/端点说错（约七成以上的题有问题），
# 这里从通过结构过滤的题中挑出 30 道，按 Cypher 的真实语义重写题面；答案仍取上游 clean_answer。
# 计数题按 Cypher 的语义是「关系（行）数」，题面写明；`不…` 类题只统计该属性有取值的节点。
