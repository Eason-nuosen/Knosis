name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install '.[all]'
      # Run tests against the installed package (not imported from the source tree), which also checks package-data is complete.
      - run: cd /tmp && pytest -q -p no:cacheprovider "$GITHUB_WORKSPACE/tests"

  core-install:
    # With only core dependencies (pip install knosis), common commands must not fail on missing optional dependencies.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install .
      - run: |
          cd /tmp
          knosis kb init kb
          knosis knowledge check --ws kb
          knosis list
          HOME=/tmp/home knosis install --kb kb
