# Demo 页「这次得到了什么」的人工观察（每个 benchmark 一次运行）。数字来自各演示工作区的 .knosis/eval.json 与知识层。
ngd:
  - 测试 EM 0.60 / F1 0.72；照抄含噪图答案只有 EM 0.10（受噪声影响的 18 题 EM 0.56）
  - dev 反馈 8 次提交，正确数 1 → 3 → 6 → 7 → 8（共 10 题）
  - 噪声断言精确率 1.0：节点类型召回 1.00、属性召回 0.35
  - 撤回例：「只看端点类型就能修复关系」被反驳，它会把无关的 Guarantee 边算进 Deposit
  - 内化：矛盾处理收窄了 9 条知识的条件；3 条 usage 元知识因 dev 统计为负效果被标为 contested
tab:
  - 测试 RMSE 4000 / MAE 2296 / R² 0.880；训练均值参照 RMSE 11558
  - 撤回例：「所有记录都满足 BMI>30 分段方程」有 77 个训练反例；BMI≥30 的边界被 BMI=30 的样本反驳，改成严格 >30
  - 内化：矛盾处理收窄 18 条、改写 12 条，12 条状态调整；10 条可执行检查有 8 条在训练行成立，留出行支持率 0.875
  - 本次没有强制使用 TabPFN，agent 用自己的分段基线
rel:
  - 测试 AUROC 0.837（平凡基线 0.5）
  - 数据坑：drivers.code 有 757 行是字面字符串 \N；去掉后仍有 6 个代码对应两个车手，不能当键
  - 撤回例：「results.grid 等于 qualifying.position」与「目标按自然月计算」两个候选都被数据反驳
  - 60 条知识中 29 条是 usage 元知识（由 dev 反馈自动统计）
bi:
  - 测试 2/2
  - 数据里两张表互相矛盾：T005、T006 的 Qualifications 文本写 Ph.D，标记列却是 No；agent 保留两种来源，不自动覆盖
  - 矛盾处理：「仅凭 Subject ID 连接」与「课程名可作键」两个候选被撤回，双方互记 conflicts_with
  - refine 中 agent 已按新词汇用 merged 合并了一条重复知识
krama:
  - 测试 4/9（数值题 3/8，字符串题 1/1）；失败题多为口径有争议的题
  - 去重：两条「按反馈审计任务口径」的方法知识被合并为一条，另一条留作 merged 别名
  - 14 条 contested：多为 dev 统计显示用了反而答错的 usage 知识，默认不再被选取
  - 3 个 skill：湿干趋势、古今城市相关、国家城市均值
burr:
  - 测试 9 题全对：类、关系、属性的 mapping-based F1 均为 1.0（name-based 属性 F1 0.93）
  - 数据坑：no_pk_available 场景中 company.csv 的 id 500 行只有 183 个不同值，63% 是重复行
  - 撤回例：「列名为 id 就是行级唯一键」「目标实体只有被引用时才存在」
  - 4 个 skill；refine 中 4 条重复知识被合并（merged）
sr:
  - 测试 Acc₀.₁ 1/3、分布外 3/3；被接受的 2 个公式在留出点和分布外全部成立，被撤回的 11 个只有 1 个成立
  - 发现：五张表的温度 T 几乎等于 273 + 500·应变（相关系数 > 0.99999），只凭这些点无法分开两者的作用
  - 撤回例：四阶 sqrt(ε) 多项式 NMSE 极小，但最大相对误差不达标
newton:
  - 测试 4/4 定律正确（RMSLE 中位数 0）
  - 撤回例：「所有任务都是 C·m1·m2/r²」「所有任务对两个质量对称」
  - 内化三步都通过，没有可合并或矛盾的知识；大纲按「发现新定律 / 复用已验证公式 → 数据关系 → 观测」组织
alpha:
  - 测试信号准确率 0.33（全判 Noise 的参照 0.23），RankIC Spearman 0.53
  - dev 反馈正确数 4 → 7 → 7（共 10 题）
  - 数据坑：45.8% 的行情行不在该股的 CSI300 成员区间内，不能直接当每日截面；4.3% 的行整组缺失
  - 撤回例：「Pearson IC 与 RankIC 必定同号」
text:
  - 语料是 Knosis 自己的 8 份设计文档：71 条知识，来源可定位率与引文核对通过率均为 1.0
  - 它找出了文档里真实的不一致：一份设计文档标题写「草案，代码未实现」而正文写已实现；knowledge.md 两处对 I2 的说法不一致
kb:
  - 3 个会话一次通过验收：11 条知识、26 条证据、3 个场景
  - 复用：新 Codex 会话经 MCP 调用 knowledge_outline → knowledge_select → tool_card，回答带上收集来的注意事项（38 秒）
sheet:
  - 测试 15 条没见过的指令：soft 0.71、hard 0.60（13 条单元格级 0.74 / 0.62，2 条表级 0.50）；原样交回输入的参照 soft 0.11
  - dev 反馈：第一次 2/5 条全对，逐条修正后 refine 第 1 轮 5/5（15 个用例全对）
  - 失败多在「值的类型与写法」：日期写成文本 '21/06/2022'（答案是日期）、'15 Nov 2021' 反过来；'GOOD' 与 'Good' 大小写
  - 3 条 usage 元知识被标为 contested：dev 统计显示用到「公式缓存修复」那套做法的题反而答错
  - 6 个 skill：续行合并、交付审计、按反馈筛选、首个精确匹配行、公式缓存修复、配对网格
