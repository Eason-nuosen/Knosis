[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "knosis"
version = "1.0.0"
description = "Knowledge substrate for coding agents (Codex, Claude Code): collect, verify, organize and reuse explicit knowledge"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Eason-nuosen" }]
keywords = ["agent", "knowledge base", "mcp", "codex", "claude code", "llm"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["pyyaml", "pandas", "pyarrow"]

[project.optional-dependencies]
graph = ["networkx"]          # NGDBench .gpickle / .graphml
hdf5 = ["h5py"]               # LLM-SRBench numeric data
sheet = ["openpyxl"]          # SpreadsheetBench and the sheet tool
download = ["huggingface_hub", "openml"]
dev = ["pytest"]
all = ["networkx", "h5py", "openpyxl", "huggingface_hub", "openml", "pytest"]

[project.urls]
Homepage = "https://github.com/Eason-nuosen/Knosis"
Repository = "https://github.com/Eason-nuosen/Knosis"

[project.scripts]
knosis = "knosis.cli:main"

[tool.setuptools.packages.find]
include = ["knosis*"]

[tool.setuptools.package-data]
knosis = ["data/cards/*.md", "data/cards_cn/*.md", "workspace/templates/*.md", "workspace/templates/*/*.md",
          "workspace/templates_cn/*.md", "workspace/templates_cn/*/*.md", "tools/*/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
